<style>
  /* Cabeçalho (toolbar) e a barra de abas (guia) fixos no topo ao rolar a lista - cada
     elemento gruda no topo da janela (sticky) empilhado em sequência, um abaixo do
     outro; o "top" da barra de abas é a altura da toolbar acima dela (medida direto no
     navegador).

     A guia NÃO usa <md-tabs> de propósito: md-dynamic-height só recalcula a altura de
     verdade enquanto <md-tabs> mantém overflow:hidden (usa isso internamente pra medir/
     animar a troca de aba) - forçar overflow visível (necessário pra sticky funcionar)
     trava a altura no maior valor já calculado, então trocar pra uma aba mais curta
     (Fundamental I/II, com poucos projetos) deixava um espaço vazio enorme sobrando
     embaixo (do tamanho da aba mais longa, Ensino Médio) e, ao rolar até tentar
     "alcançar" esse vazio, o cabeçalho saía dos limites do próprio container e
     desaparecia. Uma barra de abas simples (divs + ng-click/ng-show) não tem esse
     conflito: cada aba oculta some de vez do fluxo (display:none via ng-show), a altura
     da página sempre bate com o conteúdo real da aba ativa, e não há overflow nenhum
     pra brigar com o sticky. */
  #ranking-toolbar-topo {
    position: sticky;
    top: 0;
    z-index: 2;
  }
  #ranking-tab-strip {
    position: sticky;
    top: 140px;
    z-index: 1;
    background: #fff;
    display: flex;
    border-bottom: 1px solid #e0e0e0;
  }
  #ranking-tab-strip .ranking-tab {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    color: rgba(0,0,0,0.54);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  #ranking-tab-strip .ranking-tab.active {
    color: #225024;
    border-bottom-color: #225024;
  }
</style>
<div>
  <span us-spinner>
    <div layout="row" layout-sm="column" layout-align="space-around">
      <md-progress-circular md-mode="indeterminate" md-diameter="40"></md-progress-circular>
    </div>
  </span>
  <div layout="row" layout-fill data-ng-cloak class="admin-page alert-theme" id="popupContainer">
    <section layout="column" role="main" flex>
      <md-toolbar role="toolbar" class="toolbar-admin md-whiteframe-2dp" id="ranking-toolbar-topo">
        <div class="md-toolbar-tools">
          <div>
            <img src="admin/assets/images/logo3-b.png" width="120px" id="logo" style="margin-left:40px;padding-right:15px;border-right:1px solid #225024;"></img>
            <span style="padding-left:5px;font-weight:200;color:#225024;">Ranking das pontuações</span>
          </div>

	<span flex></span>

	<div style="width:120px;">
          <md-select data-ng-model="rank" placeholder="Rank" style="width:100%!important;font-size:17px;">
            <md-optgroup label="Ranqueamento:">
              <md-option id="Alfa" value="nomeProjeto" data-ng-click="recarregar('nomeProjeto')">Alfabético</md-option>
              <md-option id="Rank" value="-total" data-ng-selected="true" data-ng-click="recarregar('-total')">Total</md-option>
            </md-optgroup>
          </md-select>
        </div>

          <span flex></span>

          <md-menu>
            <md-button md-no-ink class="no-hover" style="font-size:13px;color:#225024;margin-right:30px;" ng-click="$mdOpenMenu($event)">
              <md-icon md-svg-src="file-pdf-box" style="color:#225024;width:28px;height:28px;"></md-icon>
              Baixar PDF
            </md-button>
            <md-menu-content width="4">
              <md-menu-item>
                <md-button ng-click="baixarPdfColocacao()" class="grey-text darken-3">
                  <md-icon md-svg-src="trophy" class="grey-text darken-3"></md-icon>
                  Com colocação (1º, 2º, 3º)
                </md-button>
              </md-menu-item>
              <md-menu-item>
                <md-button ng-click="baixarPdfDestaques()" class="grey-text darken-3">
                  <md-icon md-svg-src="star" class="grey-text darken-3"></md-icon>
                  Destaques (sem colocação)
                </md-button>
              </md-menu-item>
            </md-menu-content>
          </md-menu>
        </div>
        <div class="md-toolbar-tools" style="height:56px;min-height:56px;">
          <span flex></span>
          <div style="width:230px;" layout="row" layout-align="start center">
            <label style="font-size:13px;color:#225024;white-space:nowrap;margin-right:8px;">Premiados por eixo:</label>
            <input type="number" min="1" step="1" data-ng-model="numPremiadosPorEixo" style="width:50px;font-size:15px;color:#225024;">
          </div>
          <span flex="5"></span>
          <md-button md-no-ink class="no-hover" style="font-size:13px;color:#225024;" ng-click="confirmarPremiados($event)">
            <md-icon md-svg-src="check-circle" style="color:#225024;width:24px;height:24px;"></md-icon>
            Confirmar premiados
          </md-button>
          <span flex></span>
        </div>
      </md-toolbar>

      <div id="ranking-tab-strip">
        <div class="ranking-tab" ng-class="{active: abaAtiva === 'fund1'}" ng-click="abaAtiva = 'fund1'">Fundamental I</div>
        <div class="ranking-tab" ng-class="{active: abaAtiva === 'fund2'}" ng-click="abaAtiva = 'fund2'">Fundamental II</div>
        <div class="ranking-tab" ng-class="{active: abaAtiva === 'ensinoMedio'}" ng-click="abaAtiva = 'ensinoMedio'">Ensino Médio, Técnico e Superior</div>
        <div class="ranking-tab" ng-class="{active: abaAtiva === 'feiras'}" ng-click="abaAtiva = 'feiras'">Feiras</div>
        <div class="ranking-tab" ng-class="{active: abaAtiva === 'mencaoHonrosa'}" ng-click="abaAtiva = 'mencaoHonrosa'">Menção Honrosa</div>
      </div>
      <div ng-show="abaAtiva === 'fund1'"><div ui-view="ranking1" id="imprimir"></div></div>
      <div ng-show="abaAtiva === 'fund2'"><div ui-view="ranking2" id="imprimir"></div></div>
      <div ng-show="abaAtiva === 'ensinoMedio'"><div ui-view="ranking3" id="imprimir"></div></div>
      <div ng-show="abaAtiva === 'feiras'"><div ui-view="feiras" id="imprimir"></div></div>
      <div ng-show="abaAtiva === 'mencaoHonrosa'"><div ui-view="mencaoHonrosa" id="imprimir"></div></div>
  </section>
</div>
</div>
