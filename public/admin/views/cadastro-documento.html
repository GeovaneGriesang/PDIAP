<span layout="column" layout-align="center center" class="loader" us-spinner>
    <div layout="row" layout-sm="column" layout-align="space-around">
        <md-progress-circular md-mode="indeterminate" md-diameter="40"></md-progress-circular>
    </div>
</span>

<div layout="row" layout-fill data-ng-cloak class="admin-page alert-theme" id="popupContainer">
    <section layout="column" role="main" flex>
        <md-toolbar role="toolbar" class="toolbar-admin md-whiteframe-2dp">
            <div class="md-toolbar-tools">
                <md-button class="md-icon-button" ng-click="toggleSidenav('left')" hide-gt-sm aria-label="Menu">
                    <md-icon md-svg-src="menu" style="color:#225024;vertical-align:baseline;"></md-icon>
                </md-button>
                <h4 class="md-title" style="color:#225024;margin:0!important;">Mostra | Documentos</h4>
            </div>

            <md-toolbar role="toolbar" class="toolbar-admin" style="box-shadow:0px 0px 0px 0px rgba(0, 0, 0, 0.2), 0px 2px 2px 0px rgba(0, 0, 0, 0.14), 0px 3px 1px -2px rgba(0, 0, 0, 0.12)">
            <div class="md-toolbar-tools">

            <div style="width:220px;">
              <md-select data-ng-model="filtro.mostraId" placeholder="Mostra" style="width:100%!important;font-size:17px;">
                <md-optgroup label="Mostra:">
                  <md-option ng-value="m._id" data-ng-repeat="m in mostras track by m._id">{{m.ano}} - {{m.nome}}</md-option>
                </md-optgroup>
              </md-select>
            </div>

            </div>
            </md-toolbar>
        </md-toolbar>
        
        <md-content>    
            <div layout="column" layout-align="center center" style="background:rgba(128,128,128,0.07);padding:40px;">
                <h1 style="text-align:center;border-top:1px solid #225024;margin:55px 0 15px 0;font-size:15px;width:100%;">
                    <span style="text-transform:uppercase;padding:5px 10px;position:relative;background:#f7f7f7;bottom:10px;letter-spacing:1px;">Cadastro Documento</span>
                </h1>
                
                <form name="editForm" novalidate class="eventos-form">
                    <md-input-container class="md-block" flex-gt-xs="110">
                        <label style="font-weight: bold;" for="pdf_documento">Selecione o arquivo (PDF, Word ou PowerPoint):</label><br>
                        <input type="file" id="pdf_documento" accept="application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.ms-powerpoint, application/vnd.openxmlformats-officedocument.presentationml.presentation" name="layoutcertificado"/>
                    </md-input-container>
                    
                    <md-input-container class="md-block" flex-gt-xs="110">
                        <input placeholder="Título do Documento" type="text" name="Documento" data-ng-model="titulo_documento" style="overflow: hidden; resize: none;" required>
                    </md-input-container>          
                    
                    <md-input-container class="md-block" flex-gt-xs="30">
                        <md-select data-ng-model="form.mostraId" placeholder="Mostra" disableOptionCentering style="width:100%!important;font-size:17px;" required>
                            <md-optgroup label="Mostra:">
                                <md-option ng-value="m._id" data-ng-repeat="m in mostras track by m._id">{{m.ano}} - {{m.nome}}</md-option>
                            </md-optgroup>
                        </md-select>
                    </md-input-container>        
                    
                    <md-input-container class="md-block" flex-gt-xs="30">
                        <div style="display: flex;">
                            <p>Exibir:</p>
                            <input type="checkbox" data-ng-model="Exibe_documento" class="md-checkbox">
                        </div>
                    </md-input-container>   
                    
                    <div class="finalizar" layout="row" layout-align="center center" data-ng-if="!spinnerActive" style="margin:40px 0 20px 0;">
                        <md-button class="md-raised md-primary white green darken-1 btnEntrar2" aria-label="Salvar" data-ng-disabled="!editForm.$valid" data-ng-click="CadastraDocumento()">
                            <md-icon md-svg-icon="check" ng-style="{width:'20px', height:'20px', color:'rgba(255,255,255,0.87)', 'margin-bottom':'3px'}"></md-icon>
                            <span style="vertical-align:middle;">Cadastrar</span>
                        </md-button>
                    </div> 
                </form>
                
                <br>
                
                <md-list data-ng-if="exibeDocumentos()" flex style="margin-bottom:50px;" class="eventos-form">
                    <md-divider></md-divider>
                    <md-list-item class="md-3-line" data-ng-repeat="info in documentos | filter:daMostra track by info._id" style="padding:0 45px;">
                        <div class="md-list-item-text" style="flex:1 1 auto;min-width:0;margin-right:5px;text-align:left;">
                            <h3>{{info.titulo}}</h3>
                            <p data-ng-if="info.feiraId">Mostra: {{nomeMostra(info.feiraId)}}</p>
                            <div data-ng-if="!info.feiraId" layout="row" layout-align="start center" style="flex-wrap:wrap;">
                                <span style="color:#7a4a00;font-size:13px;margin-right:8px;">Documento antigo de {{info.ano}}, sem Mostra definida:</span>
                                <md-select data-ng-model="info.novaMostra" placeholder="Escolher a Mostra" aria-label="Mostra do documento" style="margin:0;min-width:200px;">
                                    <md-option ng-value="m._id" data-ng-repeat="m in mostras track by m._id">{{m.ano}} - {{m.nome}}</md-option>
                                </md-select>
                                <md-button class="md-raised" style="text-transform:none;" data-ng-disabled="!info.novaMostra" data-ng-click="mudarMostra(info)">Salvar Mostra</md-button>
                            </div>
                        </div>
                        <div class="md-list-item-text" style="flex:0 0 110px;align-self:center;">
                            <h3>Exibir: <input type="checkbox" data-ng-model="info.exibe" aria-label="confirmar" class="md-checkbox" data-ng-click="UpdateExibir(info._id, info.exibe)"></h3>
                        </div>
                        <div style="flex:0 0 360px;display:flex;align-self:center;justify-content:flex-end;gap:12px;">
                            <md-button no-ink class="md-raised md-whiteframe-1dp" style="border-radius:70px;min-height:30px;line-height:30px;box-shadow:none!important; background-color: green;" aria-label="Visualizar documento" ng-click="Visualiza(info)">
                                <md-icon md-svg-icon="eye" ng-style="{width:'18px', height:'18px', color:'rgba(255,255,255,0.87)', 'margin-bottom':'3px'}"></md-icon>
                                <span style="vertical-align:middle;font-size:13px;color:rgba(255,255,255,0.87);">Visualizar / Baixar</span>
                            </md-button>
                            <md-button no-ink class="md-raised red md-whiteframe-1dp" style="border-radius:70px;min-height:30px;line-height:30px;box-shadow:none!important;" aria-label="Remover documento" ng-click="RemoveDocumento($event, info.titulo, info._id)">
                                <md-icon md-svg-icon="close" ng-style="{width:'18px', height:'18px', color:'rgba(255,255,255,0.87)', 'margin-bottom':'3px'}"></md-icon>
                                <span style="vertical-align:middle;font-size:13px;color:rgba(255,255,255,0.87);">Remover</span>
                            </md-button>
                        </div>
                    </md-list-item>
                    <md-divider></md-divider>
                </md-list>
            </div>
            <iframe src="" id="visualizaPdf" style="height: 600px; width: 98%; overflow-x: hidden; border:1px solid #ddd;"></iframe>
        </md-content>
    </section>
</div>
